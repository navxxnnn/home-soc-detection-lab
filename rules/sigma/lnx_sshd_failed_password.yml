title: Linux SSH Failed Password
id: 7c1e4f6a-2b3d-4c5e-8f90-1a2b3c4d5e03
status: experimental
description: >
    SSH authentication failures in auth.log. Alert when more than 5 failures come from the
    same source IP within 1 minute.
author: Naveen Kumar H
date: 2026-01-01
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: sshd
detection:
    keywords:
        - 'Failed password'
        - 'Invalid user'
        - 'authentication failure'
    condition: keywords
falsepositives:
    - Users mistyping passwords
level: low
