title: Suspicious Service Installed (PsExec-like)
id: 7c1e4f6a-2b3d-4c5e-8f90-1a2b3c4d5e05
status: experimental
description: New service installed whose binary path points to a writable or admin share location, typical of PsExec-style lateral movement.
author: YOUR NAME
date: 2026-01-01
tags:
    - attack.lateral-movement
    - attack.t1021.002
    - attack.execution
    - attack.t1569.002
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 7045
    selection_path:
        ImagePath|contains:
            - '\ADMIN$\'
            - '\Windows\Temp\'
            - '\Users\Public\'
            - 'PSEXESVC'
            - '%COMSPEC%'
            - 'cmd.exe /c'
    condition: selection and selection_path
falsepositives:
    - Legitimate remote admin tools - document and exclude by ServiceName
level: high
