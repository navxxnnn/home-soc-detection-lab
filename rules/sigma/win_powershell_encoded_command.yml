title: Suspicious PowerShell Encoded Command
id: 7c1e4f6a-2b3d-4c5e-8f90-1a2b3c4d5e01
status: experimental
description: Detects PowerShell launched with a Base64-encoded command, often used to hide payloads.
author: YOUR NAME
date: 2026-01-01
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cli:
        CommandLine|contains:
            - ' -enc '
            - ' -e '
            - ' -EncodedCommand '
            - ' -ec '
    condition: all of selection_*
falsepositives:
    - Admin and management scripts (SCCM, Intune) - baseline and exclude by parent process
level: medium
