title: Windows Failed Network or RDP Logon
id: 7c1e4f6a-2b3d-4c5e-8f90-1a2b3c4d5e02
status: experimental
description: >
    Failed logons over the network (type 3) or RDP (type 10). Alert in the SIEM when
    more than 10 events share the same IpAddress within 5 minutes.
author: YOUR NAME
date: 2026-01-01
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType:
            - 3
            - 10
    condition: selection
fields:
    - IpAddress
    - TargetUserName
    - WorkstationName
falsepositives:
    - Users mistyping passwords
    - Service accounts with expired passwords
level: low
