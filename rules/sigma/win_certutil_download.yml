title: Certutil Used to Download a File
id: 7c1e4f6a-2b3d-4c5e-8f90-1a2b3c4d5e06
status: experimental
description: certutil.exe with -urlcache or -verifyctl used to fetch remote content (living-off-the-land download).
author: Naveen Kumar H
date: 2026-01-01
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_cli:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
    selection_http:
        CommandLine|contains: 'http'
    condition: all of selection_*
falsepositives:
    - Rare legitimate certificate administration
level: high
